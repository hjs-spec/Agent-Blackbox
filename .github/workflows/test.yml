name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Record a failed parent and a successful child
        id: record
        run: |
          python tests/record_sample.py "$RUNNER_TEMP/incident journal" > "$RUNNER_TEMP/hashes.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          hashes = json.loads((Path(os.environ["RUNNER_TEMP"]) / "hashes.json").read_text())
          print("child=" + hashes["child"])
          PY
      - name: Review the saved chain in a fresh process
        id: saved
        uses: ./
        with:
          storage_path: ${{ runner.temp }}/incident journal
          event_hash: ${{ steps.record.outputs.child }}
      - name: Verify action outputs
        env:
          REVIEW: ${{ steps.saved.outputs.review_result }}
          CANDIDATE: ${{ steps.saved.outputs.candidate_failure_node }}
        run: |
          python - <<'PY'
          import json, os
          review = json.loads(os.environ["REVIEW"])
          assert review["verification_status"] == "verified"
          assert [entry["status"] for entry in review["chain"]] == ["failed", "success"]
          assert review["score_basis"] == "declared_ancestor_failed"
          assert os.environ["CANDIDATE"] == "planner"
          PY
      - name: Check that missing trusted keys fail the action
        id: missing_keys
        continue-on-error: true
        uses: ./
        with:
          storage_path: ${{ runner.temp }}/incident journal
          trusted_keys_path: ${{ runner.temp }}/empty-trust-store
          event_hash: ${{ steps.record.outputs.child }}
      - name: Assert the negative step reported failure
        env:
          ACTUAL: ${{ steps.missing_keys.outcome }}
        run: test "$ACTUAL" = failure
