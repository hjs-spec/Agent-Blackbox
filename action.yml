name: "Agent Blackbox Incident Review"
description: "Review signed event records and declared links from Agent Blackbox logs"
author: "HJS Spec"

branding:
  icon: "search"
  color: "black"

inputs:
  event_hash:
    description: "Event hash to review"
    required: true
  storage_path:
    description: "Path to blackbox logs"
    required: false
    default: "./blackbox_logs"
  trusted_keys_path:
    description: "Optional independently provisioned directory of trusted recorder public keys"
    required: false

outputs:
  review_result:
    description: "Incident review result JSON"
    value: ${{ steps.review.outputs.review_result }}
  candidate_failure_node:
    description: "Candidate failure node for human review"
    value: ${{ steps.review.outputs.candidate_failure_node }}

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install Agent Blackbox
      env:
        ACTION_SOURCE: ${{ github.action_path }}
      run: python -m pip install "$ACTION_SOURCE"
      shell: bash
    - name: Run incident review
      id: review
      env:
        BLACKBOX_STORAGE: ${{ inputs.storage_path }}
        BLACKBOX_EVENT_HASH: ${{ inputs.event_hash }}
        BLACKBOX_TRUSTED_KEYS: ${{ inputs.trusted_keys_path }}
      run: |
        set -euo pipefail
        report=$(mktemp)
        trap 'rm -f "$report"' EXIT
        options=(--storage "$BLACKBOX_STORAGE")
        if [[ -n "$BLACKBOX_TRUSTED_KEYS" ]]; then
          options+=(--trusted-keys "$BLACKBOX_TRUSTED_KEYS")
        fi
        agent-blackbox "${options[@]}" review -- "$BLACKBOX_EVENT_HASH" > "$report"
        python - "$report" <<'PY'
        import json, os, sys, uuid
        with open(sys.argv[1], encoding="utf-8") as stream:
            report = json.load(stream)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            for name, value in (("review_result", json.dumps(report)),
                                ("candidate_failure_node", report["candidate_failure_node"])):
                delimiter = uuid.uuid4().hex
                print(f"{name}<<{delimiter}\n{value}\n{delimiter}", file=output)
        PY
      shell: bash
